<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CP Profile Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>CP Profile Dashboard</h2>
    
    <!-- SETUP -->
    <div id="setup" class="card">
      <div class="form-group">
        <label for="cf">Codeforces ID</label>
        <input id="cf" placeholder="Enter your Codeforces username" />
      </div>
      
      <div class="form-group">
        <label for="lc">LeetCode ID</label>
        <input id="lc" placeholder="Enter your LeetCode username" />
      </div>
      
      <div class="form-group">
        <label for="cc">CodeChef ID</label>
        <input id="cc" placeholder="Enter your CodeChef username" />
      </div>
      
      <button id="save">Save Profiles</button>
    </div>
    
    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;" class="card">
      <div id="stats">
      </div>
      <button id="edit">Edit Profile IDs</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
